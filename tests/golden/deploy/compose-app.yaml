# flagd serves the flags in flags.flagd.json over OFREP.
# Merge this into your Compose file. flagwire toggle edits the file in place,
# and flagd picks the change up without a restart.
services:
  flagd:
    image: ghcr.io/open-feature/flagd:v0.18.2
    command: ["start", "--uri", "file:/etc/flagd/flags.flagd.json"]
    volumes:
      - ./flags.flagd.json:/etc/flagd/flags.flagd.json:ro
  app:
    environment:
      FLAGWIRE_PROVIDER: ofrep
      FLAGWIRE_OFREP_URL: http://flagd:8016
    depends_on:
      - flagd
